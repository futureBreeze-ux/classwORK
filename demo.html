<script>
//loops
//number of iterations to be peformed as long as the condtion is true
//while loop
document.write("<h4>While Loop</h4>");
let i = 7;//intialize the loop variable
while (i <= 13){// loop condition
    document.write(i+ "<br>");
    i+=2;
    

}
//do-while loop
document.write("<h4>do-while loop</h4>")
let j=1;
do{
    document.write(j + "<br>");
    j+=2;
}while (j <= 13);

//for loop
document.write("<h4>For loop</h4>");
for (let k = 12;k <=28;k+=2){
    document.write(k + "<br>");
}

//for-of loop
document.write("<h4>for-of loop</h4>");
let colors = ["Red", "Green", "Blue"];
for (let color of colors){
    document.write(color + "<br>");
}

//for-in loop
document.write("<h4>for-in loop</h4>");
let person = {
    name: "Ian",
    age: 25,
    city: "Nairobi"
};
for (let key in person){
    document.write(key + ": " + person[key] + "<br>");
}

</script>
