<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .error{
        color: red;
        font-weight: bold;
        margin: 0;
    }
    .registration-form{
        width: 300px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
    }
    .registration-form h2{
        text-align: center;
        margin-bottom: 20px;
    }
    .registration-form .field{
        margin-bottom: 15px;
    }
    .registration-form label{
        display: block;
        margin-bottom: 5px;
    }
    .registration-form input{
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
    }
    .registration-form button{
        width: 100%;
        padding: 10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    .registration-form button:hover{
        background-color: #45a049;
    }

</style>
<body>
    <!--
<a href="#" onclick="document.getElementById('Showconten').textContent='Invalid Email'">Show Content</a>
     <a href="#" onclick="document.getElementById('Showconten').textContent='Hide Content'">Hide Content</a>
    <p id="Showconten" class="error"></p>
    -->
    <form action="" method="" id="registrationform" class="registration-form" novalidate>
    <h2>Registration Form</h2>
    <div class="field">
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" autofocus maxlength="60"><br>
        <p id="fullnameError" class="error"></p>
    </div>
    <div class="field">
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br>
        <p id="emailError" class="error"></p>
    </div>
    <div class="field">
        <label for="phoneNumber">Phone Number:</label><br>
        <input type="tel" id="phoneNumber" name="phoneNumber" maxlength="15"><br>
        <p id="phoneError" class="error"></p>
    </div>
    <div class="field">
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br>
        <p id="passwordError" class="error"></p>
    </div>
    <div class="field">
        <label for="confirmPassword">Confirm Password:</label><br>
        <input type="password" id="confirmPassword" name="confirmPassword"><br>
        <p id="confirmPasswordError" class="error"></p>
    </div>
    <div class="field">
    <button type="submit">Register</button>
    </div>
    <p id="validationmessage" class="success"></p>

</form>
<script>
    //javascript code to handle form submission and validation
    document.getElementById('registrationform').addEventListener('submit', function(event){
        event.preventDefault();
        document.getElementById('fullnameError').textContent = '';
        document.getElementById('emailError').textContent = '';
        document.getElementById('phoneError').textContent = '';
        document.getElementById('passwordError').textContent = '';
        document.getElementById('confirmPasswordError').textContent = '';
        document.getElementById('validationmessage').textContent = '';

        //flag to track if the form is valid
        let isValid = true;

        //validate full name
        const fullname = document.getElementById('fullname').value.trim();
        if(fullname === ''){
            document.getElementById('fullnameError').textContent = 'Full name is required';
            isValid = false;
        } else if(fullname.length < 3){
            document.getElementById('fullnameError').textContent = 'Full name must be at least 3 characters long';
            isValid = false;
        } else if(!/^[a-zA-Z\s]+$/.test(fullname)){
            document.getElementById('fullnameError').textContent = 'Full name can only contain letters and spaces';
            isValid = false;
        }

        //validate email
        const email = document.getElementById('email').value.trim();
        if(email === ''){
            document.getElementById('emailError').textContent = 'Email is required';
            isValid = false;
        } else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
            document.getElementById('emailError').textContent = 'Please correct the errors and try again';
            isValid = false;
        }

        //validate phone number
        const phone = document.getElementById('phoneNumber').value.trim();
        if(phone === ''){
            document.getElementById('phoneError').textContent = 'Phone number is required';
            isValid = false;
        } else if(!/^\d{10}$/.test(phone)){
            document.getElementById('phoneError').textContent = 'Phone number must be 10 digits long';
            isValid = false;
        }

        const password = document.getElementById('password').value.trim();
        if(password === ''){
            document.getElementById('passwordError').textContent = 'Password is required';
            isValid = false;
        }

        const confirmPassword = document.getElementById('confirmPassword').value.trim();
        if(confirmPassword === ''){
            document.getElementById('confirmPasswordError').textContent = 'Confirm password is required';
            isValid = false;
        } else if(confirmPassword !== password){
            document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
            isValid = false;
        }

        if(isValid){
            document.getElementById('validationmessage').textContent = 'Registration successful!';
        }

    });
</script>
</body>
</html>
